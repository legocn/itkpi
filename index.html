<script type="text/javascript">
function guid() {
    function S4() {
       return (((1+Math.random())*0x10000)|0).toString(16).substring(1);
    }
    return (S4()+S4()+"-"+S4()+"-"+S4()+"-"+S4()+"-"+S4()+S4()+S4());

<STYLE type="text/css">
.DigitalBoard-radio {
  display: none;
}
.DigitalBoard-radio:checked + .DigitalBoard-content {
  display: block;
}
.DigitalBoard-tab {
  display: inline-block;
  cursor: pointer;
  padding: 8px;
}
.DigitalBoard-tab:hover {
  opacity: 0.9;
}
.DigitalBoard-tabs {
  color: black;
  font-weight:bold;
  font-size:16;
}

.DigitalBoard-tabs :nth-child(1) {
  background-color: green;
  color: white;
}
.DigitalBoard-tabs :nth-child(2) {
  background-color: yellow;
}
.DigitalBoard-tabs :nth-child(3) {
  background-color: red;
}
.DigitalBoard-tabs :nth-child(4) {
  background-color: #eeeeee;
}
.DigitalBoard-tabs :nth-child(5) {
  background-color: blue;
  color: white;
}
.DigitalBoard-tabs :nth-child(6) {
  background-color: #FFE4B5;
  color: black;
}

.DigitalBoard-content {
  display: none;
  padding: 10px;
  max-width: 100%;
}

.DigitalBoard-content img,iframe{
    max-height: 900px;
    max-width: 1280px;
    vertical-align:middle;
    margin-top:-20px;
}

#DigitalBoard-tab-1 + .DigitalBoard-content{
  background-color: green;
  color: white;
}
#DigitalBoard-tab-2 + .DigitalBoard-content{

  color: black;
}
#DigitalBoard-tab-3 + .DigitalBoard-content{
  background-color: red;
  color: black;
}
#DigitalBoard-tab-4 + .DigitalBoard-content{
  background-color: #eeeeee;
  color: black;
}
#DigitalBoard-tab-5 + .DigitalBoard-content{
  background-color: blue;
  color: white;
}
#DigitalBoard-tab-6 + .DigitalBoard-content{
  background-color: #FFE4B5;
  color: black;
}
.big-radio{
	width: 24px;
	height: 24px;
}

a:link {text-decoration:none;color:blue;} a:hover {text-decoration:underline;color:red;} a:active {text-decoration:none;color:yellow;} a:visited {text-decoration:none;color:blue;}
</STYLE>
</head>
<body>
<div class="DigitalBoard-tabs">
  <label class="DigitalBoard-tab" for="DigitalBoard-tab-1">Safety</label>
